# Character Map Generator — VPS nginx server block
# Proxies charactermap.torgersen.ai → lfc (home server, 10.0.0.2) via WireGuard
#
# NOTE: Before deploying, add this to the VPS nginx http{} block:
#   proxy_cache_path /var/cache/nginx/tmdb levels=1:2 keys_zone=tmdb_images:10m inactive=30d max_size=5g;
#
# This file lives in the charactermap repo and is copied to usv-fleet/config/ as part of deploy.

server {
    listen 443 ssl;
    server_name charactermap.torgersen.ai;

    ssl_certificate     /etc/nginx/certs/charactermap.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/charactermap.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    set $lfc_backend 10.0.0.2;

    # Frontend static files
    location / {
        proxy_pass          http://$lfc_backend:8201;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # SSE stream — long-lived, no buffering. Scoped to the exact stream path
    # so POST /api/jobs (no trailing slash) is NOT auto-301'd to /api/jobs/ —
    # WebKit refuses to follow that and surfaces 'Load failed' to the user.
    location ~ ^/api/jobs/[^/]+/stream$ {
        proxy_pass          http://$lfc_backend:8202;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  5m;
    }

    # TMDb image proxy — nginx-level cache (5 GB, 30-day TTL)
    location /images/tmdb/ {
        proxy_pass          http://$lfc_backend:8202;
        proxy_cache         tmdb_images;
        proxy_cache_valid   200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header          X-Cache-Status $upstream_cache_status;
    }

    # General API
    location /api/ {
        proxy_pass          http://$lfc_backend:8202;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name charactermap.torgersen.ai;
    return 301 https://$host$request_uri;
}
